<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>いつも隣にいた君</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2.25rem; }
      * { box-sizing: border-box; }
      :root{
        --bg:#f4efe6; --panel:#fffdf7; --ink:#2c2620; --ink-soft:#6b5f4e;
        --line:#ddd2bd; --accent:#3f6d8e; --accent-ink:#ffffff;
        --warm:#c96f2e; --good:#4d7c4d; --bad:#b0483e; --gold:#a8842c;
        --chip:#efe7d6; --shadow:0 6px 24px rgba(60,45,20,.16);
        --bar-track:#e7ddc9;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#171a20; --panel:#22262f; --ink:#ece5d8; --ink-soft:#b3a893;
          --line:#3d434f; --accent:#7fb0d1; --accent-ink:#12202c;
          --warm:#e09a54; --good:#8fbf8f; --bad:#e08a80; --gold:#d9b45c;
          --chip:#2c313c; --shadow:0 6px 24px rgba(0,0,0,.5);
          --bar-track:#333947;
        }
      }
      html,body{ margin:0; padding:0; }
      body{
        background:var(--bg); color:var(--ink);
        font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
        -webkit-text-size-adjust:100%;
      }
      .wrap{ max-width:860px; margin:0 auto; padding:10px 12px 40px; }
      /* ===== ステータスバー ===== */
      .statusbar{
        display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
        background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:8px 14px; box-shadow:var(--shadow); font-size:.95rem;
      }
      .statusbar .date{ font-family:"Shippori Mincho",serif; font-weight:700; font-size:1.08rem; }
      .statusbar .phase{ background:var(--chip); border-radius:999px; padding:2px 10px; font-size:.82rem; color:var(--ink-soft); }
      .statusbar .spacer{ flex:1; }
      .iconbtn{
        border:1px solid var(--line); background:var(--chip); color:var(--ink);
        border-radius:8px; padding:4px 12px; font:inherit; font-size:.88rem; cursor:pointer; min-height:2.25rem;
      }
      .iconbtn:active{ transform:translateY(1px); }
      /* ===== シーン ===== */
      .scene{
        position:relative; margin-top:10px; border-radius:14px; overflow:hidden;
        border:1px solid var(--line); box-shadow:var(--shadow);
        aspect-ratio:16/10; background:#20242e;
      }
      @media (min-width:700px){ .scene{ aspect-ratio:16/8.2; } }
      .scene img.bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
      .scene .grad{ position:absolute; inset:0; }
      .scene .place{
        position:absolute; top:10px; left:12px; z-index:3;
        background:rgba(20,18,14,.62); color:#f5eedd; border-radius:8px;
        padding:4px 12px; font-size:.9rem; letter-spacing:.04em;
      }
      .scene .tachie{
        position:absolute; bottom:0; z-index:2; height:94%;
        aspect-ratio:9/14; object-fit:cover; object-position:top center;
        border-radius:14px 14px 0 0; border:2px solid rgba(255,255,255,.65); border-bottom:none;
        box-shadow:0 6px 22px rgba(0,0,0,.45);
      }
      .scene .tachie.left{ left:2%; }
      .scene .tachie.right{ right:2%; }
      .scene .tachie.center{ left:50%; transform:translateX(-50%); }
      @media (max-width:560px){ .scene .tachie{ height:82%; } }
      /* ===== ギャラリー ===== */
      .gal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; margin-top:10px; }
      .gal-grid figure{ margin:0; }
      .gal-grid img{ width:100%; aspect-ratio:1/1.15; object-fit:cover; object-position:top center; border-radius:8px; border:1px solid var(--line); display:block; }
      .gal-grid figcaption{ font-size:.72rem; color:var(--ink-soft); text-align:center; margin-top:2px; line-height:1.4; }
      /* ===== 会話ウィンドウ ===== */
      .dialogue{
        margin-top:10px; background:var(--panel); border:1px solid var(--line);
        border-radius:14px; box-shadow:var(--shadow); padding:16px 18px 14px; min-height:158px;
        display:flex; flex-direction:column;
      }
      .speaker{ font-weight:900; color:var(--accent); font-size:1rem; min-height:1.2em; }
      .speaker.ren{ color:var(--warm); }
      .text{ font-size:1.06rem; line-height:1.85; white-space:pre-wrap; flex:1; margin-top:2px; }
      .next-hint{ text-align:right; color:var(--ink-soft); font-size:.85rem; animation:blink 1.4s infinite; }
      @keyframes blink{ 0%,100%{opacity:.25} 50%{opacity:1} }
      @media (prefers-reduced-motion: reduce){ .next-hint{ animation:none; } }
      /* ===== 選択肢・コマンド ===== */
      .choices{ margin-top:10px; display:grid; gap:8px; }
      .choices button, .cmd-grid button{
        font:inherit; font-size:1rem; text-align:left; cursor:pointer;
        background:var(--panel); color:var(--ink); border:1.5px solid var(--line);
        border-radius:12px; padding:12px 16px; min-height:3rem; box-shadow:var(--shadow);
      }
      .choices button:hover, .cmd-grid button:hover{ border-color:var(--accent); }
      .choices button small, .cmd-grid button small{ display:block; color:var(--ink-soft); font-size:.8rem; margin-top:2px; }
      .cmd-title{ margin:14px 2px 6px; font-family:"Shippori Mincho",serif; font-weight:700; font-size:1.05rem; }
      .cmd-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      @media (max-width:520px){ .cmd-grid{ grid-template-columns:1fr; } }
      .cmd-grid button:disabled{ opacity:.45; cursor:not-allowed; }
      /* ===== パラメータ ===== */
      .panel{
        margin-top:10px; background:var(--panel); border:1px solid var(--line);
        border-radius:14px; box-shadow:var(--shadow); padding:14px 18px;
      }
      .panel h3{ margin:0 0 10px; font-family:"Shippori Mincho",serif; font-size:1.02rem; }
      .bars{ display:grid; grid-template-columns:1fr 1fr; gap:6px 22px; }
      @media (max-width:560px){ .bars{ grid-template-columns:1fr; } }
      .bar-row{ display:flex; align-items:center; gap:8px; font-size:.92rem; }
      .bar-row .name{ width:5.2em; flex:none; }
      .bar-row .val{ width:2.4em; text-align:right; font-weight:700; flex:none; }
      .bar{ flex:1; height:10px; background:var(--bar-track); border-radius:99px; overflow:hidden; }
      .bar i{ display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .5s; }
      .bar i.warm{ background:var(--warm); } .bar i.good{ background:var(--good); }
      .bar i.bad{ background:var(--bad); } .bar i.gold{ background:var(--gold); }
      .fx-note{ font-size:.9rem; color:var(--ink-soft); margin-top:8px; white-space:pre-wrap; line-height:1.7; }
      .fx-note .up{ color:var(--good); font-weight:700; } .fx-note .down{ color:var(--bad); font-weight:700; }
      /* ===== タイトル ===== */
      .title-screen{ text-align:center; padding:12px 4px 0; }
      .title-screen .cover{ border-radius:14px; overflow:hidden; border:1px solid var(--line); box-shadow:var(--shadow); }
      .title-screen .cover img{ width:100%; display:block; aspect-ratio:16/9; object-fit:cover; }
      .title-screen h1{
        font-family:"Shippori Mincho",serif; font-size:clamp(1.9rem,6vw,3rem);
        margin:18px 0 4px; letter-spacing:.06em;
      }
      .title-screen .sub{ color:var(--ink-soft); margin:0 0 16px; line-height:1.8; }
      .title-menu{ display:grid; gap:8px; max-width:420px; margin:0 auto; }
      .title-menu button{
        font:inherit; font-size:1.05rem; font-weight:700; cursor:pointer; min-height:3.1rem;
        background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px; padding:12px;
      }
      .title-menu button.sub-btn{ background:var(--panel); color:var(--ink); border:1.5px solid var(--line); }
      .name-row{ display:flex; gap:8px; justify-content:center; align-items:center; margin:0 auto 14px; max-width:420px; flex-wrap:wrap; }
      .name-row input{
        font:inherit; font-size:1rem; padding:8px 12px; border-radius:10px;
        border:1.5px solid var(--line); background:var(--panel); color:var(--ink); width:11em; min-height:2.6rem;
      }
      /* ===== エンディング ===== */
      .ending-badge{
        display:inline-block; background:var(--gold); color:#fff; border-radius:999px;
        padding:4px 18px; font-weight:900; letter-spacing:.08em; margin-bottom:8px;
      }
      /* ===== モーダル ===== */
      .modal-back{
        position:fixed; inset:0; background:rgba(15,12,8,.55); z-index:50;
        display:flex; align-items:center; justify-content:center; padding:16px;
      }
      .modal{
        background:var(--panel); color:var(--ink); border-radius:14px; max-width:520px; width:100%;
        max-height:86vh; overflow:auto; padding:20px; box-shadow:var(--shadow);
      }
      .modal h2{ font-family:"Shippori Mincho",serif; margin:0 0 10px; font-size:1.2rem; }
      .modal p, .modal li{ line-height:1.8; font-size:.95rem; }
      .modal .row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
      .modal button{
        font:inherit; cursor:pointer; border-radius:10px; padding:10px 16px; min-height:2.8rem;
        background:var(--accent); color:var(--accent-ink); border:none; font-weight:700;
      }
      .modal button.sub-btn{ background:var(--chip); color:var(--ink); border:1px solid var(--line); }
      .slot{ border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; }
      .slot .meta{ font-size:.85rem; color:var(--ink-soft); }
      .hidden{ display:none !important; }
      .log-line{ font-size:.9rem; color:var(--ink-soft); line-height:1.7; }
      footer{ text-align:center; color:var(--ink-soft); font-size:.82rem; margin-top:22px; line-height:1.8; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- ステータスバー -->
      <div class="statusbar hidden" id="statusbar">
        <span class="date" id="sb-date">―</span>
        <span class="phase" id="sb-phase">―</span>
        <span id="sb-job">―</span>
        <span class="spacer"></span>
        <span id="sb-money">所持金 ―</span>
        <button class="iconbtn" id="btn-bgm" type="button">♪ BGM オン</button>
        <button class="iconbtn" id="btn-status" type="button">関係値</button>
        <button class="iconbtn" id="btn-save" type="button">セーブ／ロード</button>
      </div>

      <!-- タイトル画面 -->
      <section id="screen-title" class="title-screen">
        <div class="cover"><img src="assets/roomshare.webp" alt="ルームシェアのリビングで笑い合う二人" /></div>
        <h1>いつも隣にいた君</h1>
        <p class="sub">小学生の頃から、ずっと隣にいた幼なじみ。<br />
        大学、社会人、そしてルームシェア――<br />
        「親友」のまま終わるのか、それとも……。</p>
        <div class="name-row">
          <label for="player-name">主人公の名前</label>
          <input id="player-name" type="text" value="悠真" maxlength="8" />
        </div>
        <div class="title-menu">
          <button type="button" id="btn-start">はじめから</button>
          <button type="button" class="sub-btn" id="btn-load-title">セーブ／ロード</button>
          <button type="button" class="sub-btn" id="btn-howto">遊び方・登場人物</button>
          <button type="button" class="sub-btn" id="btn-gallery">グラフィックギャラリー（全60枚）</button>
        </div>
        <p class="sub" style="margin-top:16px; font-size:.85rem;">育成期間：大学4年4月 〜 社会人1年目3月（全48ターン）<br />エンディングは関係値で分岐します。</p>
      </section>

      <!-- ゲーム画面 -->
      <section id="screen-game" class="hidden">
        <div class="scene" id="scene">
          <img class="bg" id="scene-bg" src="assets/flashback.webp" alt="" />
          <div class="grad" id="scene-grad"></div>
          <div class="place" id="scene-place">回想</div>
          <img class="tachie left hidden" id="tachie-left" src="assets/yuma-smile.webp" alt="" />
          <img class="tachie right hidden" id="tachie-ren" src="assets/ren.webp" alt="蓮" />
        </div>

        <div class="dialogue" id="dialogue">
          <div class="speaker" id="dlg-speaker"></div>
          <div class="text" id="dlg-text"></div>
          <div class="next-hint" id="dlg-next"><button type="button" id="btn-next" class="iconbtn">次へ ▼</button></div>
        </div>

        <div class="choices hidden" id="choices"></div>

        <div id="command-area" class="hidden">
          <p class="cmd-title" id="cmd-title">今週の行動を選んでください</p>
          <div class="cmd-grid" id="cmd-grid"></div>
        </div>

        <div class="panel hidden" id="fx-panel">
          <h3>今週の結果</h3>
          <div class="fx-note" id="fx-note"></div>
        </div>

        <div class="panel" id="status-panel">
          <h3>パラメータ</h3>
          <div class="bars" id="stat-bars"></div>
          <h3 style="margin-top:16px;">蓮との関係</h3>
          <div class="bars" id="rel-bars"></div>
          <div class="fx-note" id="rel-hint"></div>
        </div>

        <div class="panel hidden" id="log-panel">
          <h3>これまでの記録</h3>
          <div id="log-body"></div>
        </div>
      </section>

      <footer>
        いつも隣にいた君 ― 育成シミュレーション<br />
        作：Snow Moon
      </footer>
    </div>

    <!-- モーダル -->
    <div class="modal-back hidden" id="modal-back">
      <div class="modal" id="modal"></div>
    </div>

    <script>
    "use strict";
    /* ============================================================
       BGMエンジン（WebAudio合成・場面ごとに別の作曲）
       - title   : ハ長調 4/4 ゆったりした主題
       - daily   : ト長調 4/4 軽い日常の旋律
       - memory  : ヘ長調 3/4 ワルツ調の回想
       - drink   : ニ長調 2拍子 跳ねる飲み会の旋律
       - sad     : イ短調 4/4 下行する切ない旋律
       - ending  : 変ホ長調 4/4 ロングトーンの感動系
       旋律・和音・リズム・拍子すべて別々に作曲してある。
       ============================================================ */
    const BGM = (() => {
      let ctx = null, timer = null, on = true, current = null, step = 0;
      const N = { C4:261.63, D4:293.66, E4:329.63, F4:349.23, G4:392.00, A4:440.00, B4:493.88,
        C5:523.25, D5:587.33, E5:659.25, F5:698.46, G5:783.99, A5:880.00, B5:987.77, C6:1046.50,
        G3:196.00, A3:220.00, B3:246.94, E3:164.81, F3:174.61, D3:146.83, C3:130.81,
        Eb4:311.13, Bb3:233.08, Bb4:466.16, Eb5:622.25, G5x:783.99, Ab3:207.65, Ab4:415.30,
        Fs4:369.99, A4x:440.00, Cs5:554.37, E5x:659.25, B4x:493.88, Fs5:739.99, D5x:587.33, A3x:220.00, E4x:329.63, B3x:246.94, D4x:293.66, Fs3:185.00, Cs4:277.18 };
      // 各曲: bpm, 波形, 旋律[音名,拍数]..., 和音[根音,拍数]（長3度の和音を簡易構成）
      const TRACKS = {
        title: { bpm: 76, wave: "triangle", vol: .20,
          mel: [["E4",1],["G4",1],["C5",2],["B4",1],["A4",1],["G4",2],["A4",1],["B4",1],["C5",3],["R",1],["D5",1],["C5",1],["B4",1],["A4",1],["G4",2],["E4",2],["D4",4]],
          bass: [["C3",4],["G3",4],["A3",4],["F3",4],["C3",4],["G3",4],["F3",2],["G3",2],["C3",4]] },
        daily: { bpm: 104, wave: "sine", vol: .17,
          mel: [["D5",.5],["B4",.5],["G4",1],["A4",.5],["B4",.5],["D5",1],["E5",.5],["D5",.5],["B4",1],["A4",2],["R",1],["B4",.5],["D5",.5],["G5",1],["E5",.5],["D5",.5],["B4",1],["A4",1],["G4",2]],
          bass: [["G3",2],["D3",2],["E3",2],["C3",2],["G3",2],["D3",2],["C3",2],["D3",2],["G3",2]] },
        memory: { bpm: 92, wave: "triangle", vol: .18,
          mel: [["F4",1],["A4",1],["C5",1],["F5",1.5],["E5",.5],["D5",1],["C5",1],["A4",1],["Bb4",1],["A4",1],["G4",1],["F4",3],["R",1],["A4",1],["G4",1],["F4",1],["E4",1],["F4",2]],
          bass: [["F3",3],["Bb3",3],["F3",3],["C3",3],["F3",3],["C3",3]] },
        drink: { bpm: 132, wave: "square", vol: .10,
          mel: [["Fs4",.5],["A4x",.5],["D5x",.5],["A4x",.5],["Fs5",1],["E5x",.5],["D5x",.5],["Cs5",.5],["E5x",.5],["A4x",1],["R",.5],["B4x",.5],["Cs5",.5],["D5x",.5],["E5x",.5],["Fs5",.5],["E5x",.5],["D5x",.5],["Cs5",.5],["B4x",.5],["A4x",2]],
          bass: [["D3",1],["A3x",1],["B3x",1],["Fs3",1],["G3",1],["D3",1],["A3x",1],["A3x",1],["D3",2]] },
        sad: { bpm: 66, wave: "sine", vol: .20,
          mel: [["A4",2],["G4",1],["E4",1],["F4",2],["E4",2],["D4",2],["C4",1],["D4",1],["E4",3],["R",1],["E4",2],["F4",1],["G4",1],["A4",2],["G4",2],["E4",4]],
          bass: [["A3",4],["F3",4],["C3",4],["E3",4],["A3",4],["F3",4],["E3",4],["A3",4]] },
        ending: { bpm: 70, wave: "triangle", vol: .20,
          mel: [["Eb4",2],["G4",2],["Bb4",3],["Eb5",1],["D5",2],["Bb4",2],["C5",4],["Bb4",2],["Ab4",2],["G4",3],["Eb4",1],["F4",2],["G4",2],["Eb4",4],["R",2]],
          bass: [["Eb4",0],["C3",4],["Ab3",4],["Eb3",4],["Bb3",4],["C3",4],["Ab3",4],["Eb3",4],["Eb3",4]] }
      };
      function freq(name){ return name === "R" ? 0 : (N[name] || 0); }
      function tone(f, t, dur, wave, vol){
        if(!f) return;
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = wave; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.95);
        o.connect(g); g.connect(ctx.destination);
        o.start(t); o.stop(t + dur);
      }
      function playBar(){
        const tr = TRACKS[current]; if(!tr) return;
        const beat = 60 / tr.bpm;
        // 旋律を1小節分（最大4拍）ずつ進める簡易スケジューラ：全体をループ再生
        let t = ctx.currentTime + 0.06;
        let mt = t;
        for(const [n, d] of tr.mel){ tone(freq(n), mt, d * beat, tr.wave, tr.vol); mt += d * beat; }
        let bt = t;
        for(const [n, d] of tr.bass){ if(d > 0){ tone(freq(n), bt, d * beat, "sine", tr.vol * 0.8); tone(freq(n) * 1.5, bt, d * beat, "sine", tr.vol * 0.25);} bt += d * beat; }
        const total = Math.max(mt, bt) - t;
        timer = setTimeout(playBar, total * 1000);
      }
      function start(name){
        if(!on) { current = name; return; }
        if(current === name && timer) return;
        stop();
        current = name;
        if(!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
        if(ctx.state === "suspended") ctx.resume();
        playBar();
      }
      function stop(){ if(timer){ clearTimeout(timer); timer = null; } }
      function setOn(v){
        on = v;
        if(!on) stop();
        else if(current) { const c = current; current = null; start(c); }
      }
      return { start, stop, setOn, isOn: () => on };
    })();

    /* ============================================================
       ゲーム状態
       t: 0..47（半月単位） 0=大学4年4月前半 〜 47=社会人1年目3月後半
       ============================================================ */
    const CAL = [];
    for(let y = 0; y < 2; y++) for(let m = 0; m < 12; m++) CAL.push({ year: y, month: (4 + m - 1) % 12 + 1 });
    // CAL[i].month: i=0→4月 ... i=8→12月, i=9→1月 ...
    function dateLabel(t){
      const c = CAL[Math.floor(t / 2)];
      const era = c.year === 0 ? "大学4年" : "社会人1年目";
      return era + " " + c.month + "月" + (t % 2 === 0 ? "前半" : "後半");
    }
    function calMonth(t){ return CAL[Math.floor(t / 2)].month; }

    let S = null;
    function newState(name){
      return {
        name: name || "悠真",
        t: 0,
        hp: 80, stress: 10, money: 42000, skill: 15, charm: 15,
        rel: { friend: 45, trust: 35, close: 25, love: 0, jealous: 0, guard: 15 },
        shiori: 15, misaki: 0,
        job: "student",           // student / worker / freeter / none
        company: "",               // 就職先
        share: false,              // ルームシェア中
        gfKnown: false,            // 蓮に彼女がいることを知っている
        gfGone: false,             // 蓮と美咲が別れた
        confessed: false,
        certs: 0,                  // 資格の数
        fired: false, quitDone: false,
        seen: {},                  // 既出イベント
        log: [],

    }
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    function fxLog(s){ S.log.push(dateLabel(S.t) + "：" + s); }
    function applyFx(fx){
      const notes = [];
      const names = { hp:"体力", stress:"ストレス", money:"所持金", skill:"実力", charm:"魅力",
        friend:"友情", trust:"信頼", close:"親密", love:"恋愛感情", jealous:"嫉妬", guard:"警戒",
        shiori:"栞の好意", misaki:"美咲との仲" };
      for(const k in fx){
        const d = fx[k]; if(!d) continue;
        if(k in S.rel){ S.rel[k] = clamp(S.rel[k] + d, 0, 100); }
        else if(k === "shiori"){ S.shiori = clamp(S.shiori + d, 0, 100); }
        else if(k === "misaki"){ S.misaki = clamp(S.misaki + d, 0, 100); }
        else if(k === "money"){ S.money = Math.max(0, S.money + d); }
        else if(k === "hp"){ S.hp = clamp(S.hp + d, 0, 100); }
        else if(k === "stress"){ S.stress = clamp(S.stress + d, 0, 100); }
        else if(k === "skill"){ S.skill = clamp(S.skill + d, 0, 100); }
        else if(k === "charm"){ S.charm = clamp(S.charm + d, 0, 100); }
        const nm = names[k] || k;
        const cls = (k === "stress" || k === "jealous" || k === "guard") ? (d > 0 ? "down" : "up") : (d > 0 ? "up" : "down");
        notes.push(nm + " <span class=\"" + cls + "\">" + (d > 0 ? "+" : "") + (k === "money" ? d.toLocaleString() + "円" : d) + "</span>");
      }
      return notes;
    }

    function showFace(file, side){
      const el = side === "left" ? $("tachie-left") : $("tachie-ren");
      if(!file){ el.classList.add("hidden"); return; }
      el.src = (file.indexOf("/") >= 0 || file.indexOf(":") >= 0) ? file : "assets/" + file;
      el.classList.remove("hidden");
      el.className = "tachie " + (side === "left" ? "left" : "right");
    }
    function setScene(key, place, who){
      const sc = SCENES[key] || SCENES.town;
      const bg = $("scene-bg");
      bg.src = sc.img; bg.style.display = ""; $("scene-grad").style.background = sc.grad;
      $("scene-place").textContent = place || "";
      $("tachie-ren").classList.add("hidden"); $("tachie-left").classList.add("hidden");
      if(who && FACES[who]) showFace(FACES[who], "right");
    }

    /* 会話キュー */
    let queue = [], queueDone = null, waitingChoice = false;
    function playScene(pages, done){
      queue = pages.slice(); queueDone = done || null; waitingChoice = false;
      $("choices").classList.add("hidden");
      $("command-area").classList.add("hidden");
      $("fx-panel").classList.add("hidden");
      nextPage();
    }
    function nextPage(){
      if(waitingChoice) return;
      if(queue.length === 0){
        const d = queueDone; queueDone = null;
        if(d) d();
        return;
      }
      const p = queue.shift();
      if(p.scene) setScene(p.scene, p.place, p.who);
      if(p.bgm) BGM.start(p.bgm);
      if(p.choices){
        showText(p.who || "", p.text || "");
        if(p.face) showFace(p.face, "right");
        if(p.faceLeft) showFace(p.faceLeft, "left");
        waitingChoice = true;
        const box = $("choices"); box.innerHTML = ""; box.classList.remove("hidden");
        $("dlg-next").style.visibility = "hidden";
        p.choices.forEach(c => {
          const b = document.createElement("button");
          b.type = "button"; b.textContent = c.label;
          b.addEventListener("click", () => {
            box.classList.add("hidden"); waitingChoice = false;
            $("dlg-next").style.visibility = "";
            let notes = [];
            if(c.fx) notes = applyFx(c.fx);
            if(c.flag) c.flag();
            if(c.log) fxLog(c.log);
            const after = () => { showFx(notes); nextPage(); };
            if(c.pages) { queue = c.pages.concat(queue); after(); }
            else after();
          });
          box.appendChild(b);
        });
        return;
      }
      showText(p.who || "", p.text || "");
      if(p.face) showFace(p.face, "right");
      if(p.faceLeft) showFace(p.faceLeft, "left"); else if(!p.face) $("tachie-left").classList.add("hidden");
    }
    function showText(who, text){
      const sp = $("dlg-speaker");
      sp.textContent = who;
      sp.className = "speaker" + (who === "蓮" ? " ren" : "");
      $("dlg-text").textContent = text.replaceAll("{name}", S ? S.name : "悠真");
      if(who === "蓮") setWhoOnly("蓮");
      else if(who && FACES[who]) setWhoOnly(who);
    }
    function setWhoOnly(who){
      if(who && FACES[who]) showFace(FACES[who], "right");
    }
    $("dialogue").addEventListener("click", () => { if(!$("screen-game").classList.contains("hidden")) nextPage(); });

    function barHTML(label, val, cls){
      return "<div class=\"bar-row\"><span class=\"name\">" + label + "</span><span class=\"bar\"><i class=\"" + (cls||"") + "\" style=\"width:" + clamp(val,0,100) + "%\"></i></span><span class=\"val\">" + Math.round(val) + "</span></div>";

    function renderStatus(){
      if(!S) return;
      $("sb-date").textContent = dateLabel(S.t);
      $("sb-phase").textContent = S.t < 24 ? "大学編" : (S.share ? "ルームシェア編" : "社会人編");

      $("stat-bars").innerHTML =
        barHTML("体力", S.hp, "good") + barHTML("ストレス", S.stress, "bad") +
        barHTML("実力", S.skill) + barHTML("魅力", S.charm, "gold") +
        barHTML("栞の好意", S.shiori, "warm") + barHTML("資格", S.certs * 25, "");
      const r = S.rel;
      $("rel-bars").innerHTML =
        barHTML("友情", r.friend) + barHTML("信頼", r.trust) +
        barHTML("親密", r.close, "warm") + barHTML("恋愛感情", r.love, "bad") +
        barHTML("嫉妬", r.jealous, "bad") + barHTML("警戒", r.guard, "");
      let hint = "";
      if(r.love >= 70 && r.close >= 60) hint = "蓮への気持ちは、もう「友達」の枠には収まらなくなっている。";
      else if(r.love >= 40) hint = "蓮のことが、少しずつ気になり始めている……。";
      else if(r.friend >= 80 && r.trust >= 70) hint = "揺るがない親友関係。恋愛感情がなくても、二人の絆は本物だ。";
      else if(r.jealous >= 60) hint = "嫉妬で心が荒れている。このままでは関係が壊れてしまうかもしれない。";
      $("rel-hint").textContent = hint;
      const lb = $("log-body");
      lb.innerHTML = S.log.slice(-14).map(l => "<div class=\"log-line\">・" + l + "</div>").join("");
      $("log-panel").classList.toggle("hidden", S.log.length === 0);
    }

    function pickRandomEvent(){
      const pool = RANDOM_EVENTS.filter(e => (!e.once || !S.seen[e.id]) && e.cond());
      if(pool.length === 0) return null;
      if(Math.random() < 0.30) return null; // 7割でイベント発生
      const e = pool[Math.floor(Math.random() * pool.length)];
      S.seen[e.id] = S.t;
      return { pages: e.pages() };
    }

      }
      // 季節行事
      const sev = seasonalEvent(calMonth(S.t));
      if(sev){ playScene(sev.pages, advance); return; }
      // ランダムイベント
      const rev = pickRandomEvent();
      if(rev){ playScene(rev.pages, advance); return; }
      showCommands();
    }
    function advance(){
      S.t++;
      if(S.t % 2 === 0 && S.t > 0 && S.t < 48) monthSettle();
      if(S.t >= 48){ renderStatus(); doEnding(); return; }
      startTurn();
    }
    function showCommands(){
      renderStatus();
      setScene(S.share ? "room" : (S.job === "worker" ? "office" : "town"),
        S.share ? "ルームシェアの部屋" : (S.job === "worker" ? "会社／街" : "街"), null);
      BGM.start(S.job === "student" ? "daily" : "daily");
      showText("", dateLabel(S.t) + "。今週はどう過ごそうか。");
      $("dlg-next").style.visibility = "hidden";
      const grid = $("cmd-grid"); grid.innerHTML = "";
      getCommands().forEach(c => {
        const b = document.createElement("button");
        b.type = "button";
        b.innerHTML = "";
        b.appendChild(document.createTextNode(c.label));
        const sm = document.createElement("small"); sm.textContent = c.sub; b.appendChild(sm);
        b.addEventListener("click", () => {
          $("command-area").classList.add("hidden");
          $("dlg-next").style.visibility = "";
          const r = c.run();
          const notes = r.fx ? applyFx(r.fx) : [];
          showText("", r.msg);
          showFx(notes);
          fxLog(c.label + " ― " + r.msg);
          queue = []; queueDone = () => advance();
        });
        grid.appendChild(b);
      });
      $("command-area").classList.remove("hidden");
    }

    /* ============================================================
       エンディング判定
       ============================================================ */
    function doEnding(){
      S.over = true;
      const r = S.rel;
      let title, badge, pages, bgm = "ending";
      if(S.confessed && r.love >= 60 && r.close >= 55 && S.gfGone){
        badge = "恋愛成就エンド";
        title = "「隣」から「恋人」へ";
        pages = [
          { scene:"endinglove", place:"リビング ― 3月最後の夜", bgm:"ending", who:"蓮", face:"assets/ren-confess.webp", faceLeft:"assets/yuma-confess.webp", text:"「……ありがとう。俺もずっと、お前が好きだったんだと思う。気づくのに、20年近くかかったけどな」" },
          { text:"蓮の手が、そっとこちらの手に重なった。小学生の頃、田んぼ道で繋いだ手と、少しも変わらない温かさだった。" },
          { text:"友情100、恋愛0――そんな関係もあったはずなのに。積み重ねた日々が、いつの間にか形を変えていた。" },
          { text:"これからも隣にいる。ただ、その意味が、少しだけ変わる。これからも、ずっと。　― 恋愛成就エンド ―" }
        ];
      } else if(r.friend >= 75 && r.trust >= 65){
        badge = "親友エンド";
        title = "一生ものの親友";
        pages = [
          { scene:"endingfriend", place:"リビング ― 3月最後の夜", bgm:"memory", who:"蓮", text:"「なあ。これからもよろしくな、相棒」" },
          { text:"恋愛感情がなくたって、この絆は本物だ。友情100、恋愛0。それでも二人の関係は、誰にも真似できない形で完成していた。" },
          { text:"小学生の田んぼ道から、社会人のリビングまで。いつも隣にいた君は、これからも隣にいる。　― 親友エンド ―" }
        ];
      } else if(S.shiori >= 65 && r.love < 40){
        badge = "後輩エンド";
        title = "栞との新しい日々";
        pages = [
          { scene:"park", place:"駅前の公園", bgm:"memory", who:"栞", face:"assets/shiori.webp", text:"「先輩……今度こそ、逃げないでくださいね。私、ずっと待ってたんですから」" },
          { text:"蓮とは親友のまま。栞の真っ直ぐな気持ちに、ようやく向き合う決心がついた。" },
          { text:"人生は、選ばなかった道の分だけ広がっていく。これはこれで、一つの答えだった。　― 後輩エンド ―" }
        ];
      } else if(r.jealous >= 70 || r.guard >= 70){
        badge = "すれ違いエンド"; bgm = "sad";
        title = "言えなかった言葉";
        pages = [
          { scene:"nightfail", place:"街 ― 夜", bgm:"sad", face:"assets/yuma-tired.webp", text:"嫉妬と警戒が積み重なって、二人の距離は少しずつ離れていった。" },
          { text:"言いたい言葉は、いつも喉の奥で止まってしまった。――いつも隣にいたはずなのに。" },
          { text:"関係は終わらない。でも、あの頃の距離には、まだ戻れていない。　― すれ違いエンド ―" }
        ];
      } else {
        badge = "日常エンド"; bgm = "daily";
        title = "続いていく日々";
        pages = [
          { scene:"room", place:"リビング", bgm:"daily", who:"蓮", text:"「来週さ、実家帰るついでに、昔の秘密基地の場所、見に行かねえ？」" },
          { text:"劇的なことは起きなかった。でも、二人の日常は穏やかに続いていく。" },
          { text:"答えは、まだ先でいいのかもしれない。　― 日常エンド ―" }
        ];
      }
      playScene(pages, () => {
        $("dlg-speaker").textContent = "";
        $("dlg-text").innerHTML = "";
        const d = document.createElement("div");
        d.innerHTML = "<span class=\"ending-badge\">" + badge + "</span><br /><strong style=\"font-size:1.2rem;\">" + title + "</strong><br /><br />" +
          "最終関係値 ― 友情 " + Math.round(r.friend) + " ／ 信頼 " + Math.round(r.trust) + " ／ 親密 " + Math.round(r.close) +
          " ／ 恋愛感情 " + Math.round(r.love) + " ／ 嫉妬 " + Math.round(r.jealous) + " ／ 警戒 " + Math.round(r.guard) +
          "<br />栞の好意 " + Math.round(S.shiori) + " ／ 資格 " + S.certs + " ／ 所持金 " + S.money.toLocaleString() + "円";
        $("dlg-text").appendChild(d);
        $("dlg-next").style.visibility = "hidden";
        const box = $("choices"); box.innerHTML = ""; box.classList.remove("hidden");
        const b1 = document.createElement("button"); b1.type = "button"; b1.textContent = "タイトルに戻る";
        b1.addEventListener("click", () => location.reload());
        const b2 = document.createElement("button"); b2.type = "button"; b2.textContent = "セーブ／ロード";
        b2.addEventListener("click", openSaveModal);
        box.appendChild(b1); box.appendChild(b2);
      });
      fxLog("エンディング：" + badge);
      renderStatus();
    }

    /* ============================================================
       セーブ／ロード（メモリ内スロット＋ファイル書き出し）
       ============================================================ */
    const SLOTS = [null, null, null];
    function openModal(html){ $("modal").innerHTML = html; $("modal-back").classList.remove("hidden"); }
    function closeModal(){ $("modal-back").classList.add("hidden"); }
    $("modal-back").addEventListener("click", e => { if(e.target === $("modal-back")) closeModal(); });
    function openSaveModal(){
      let html = "<h2>セーブ／ロード</h2><p>スロットはこのページを開いている間のみ有効です。長く残したい場合は、下の「ファイルに書き出し」を使ってください。</p>";
      SLOTS.forEach((s, i) => {
        html += "<div class=\"slot\"><strong>スロット" + (i + 1) + "</strong> " +
          (s ? "<span class=\"meta\">" + s.meta + "</span>" : "<span class=\"meta\">（空き）</span>") +
          "<div class=\"row\"><button type=\"button\" data-act=\"save\" data-i=\"" + i + "\">セーブ</button>" +
          (s ? "<button type=\"button\" class=\"sub-btn\" data-act=\"load\" data-i=\"" + i + "\">ロード</button>" : "") + "</div></div>";
      });
      html += "<div class=\"row\"><button type=\"button\" id=\"m-export\">ファイルに書き出し</button>" +
        "<button type=\"button\" class=\"sub-btn\" id=\"m-import\">ファイルから読み込み</button>" +
        "<button type=\"button\" class=\"sub-btn\" id=\"m-close\">閉じる</button></div>" +
        "<input type=\"file\" id=\"m-file\" accept=\".json,application/json\" class=\"hidden\" />";
      openModal(html);
      $("modal").querySelectorAll("button[data-act]").forEach(b => {
        b.addEventListener("click", () => {
          const i = Number(b.dataset.i);
          if(b.dataset.act === "save"){
            if(!S){ closeModal(); return; }
            SLOTS[i] = { meta: dateLabel(S.t) + "／" + ({ student:"大学生", worker:"会社員", freeter:"フリーター", none:"求職中" })[S.job],
              data: JSON.stringify(S) };
            openSaveModal();
          } else {
            S = JSON.parse(SLOTS[i].data);
            closeModal(); startGame(false);
          }
        });
      });
      $("m-close").addEventListener("click", closeModal);
      $("m-export").addEventListener("click", () => {
        if(!S) return;
        const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "itumolin-save.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      });
      $("m-import").addEventListener("click", () => $("m-file").click());
      $("m-file").addEventListener("change", e => {
        const f = e.target.files[0]; if(!f) return;
        f.text().then(txt => {
          try { S = JSON.parse(txt); closeModal(); startGame(false); }
          catch(err){ /* 不正なファイルは無視 */ }
        });
      });
    }
    function openHowto(){
      openModal(
        "<h2>遊び方</h2>" +
        "<p>大学4年4月から社会人1年目3月までの2年間（全48ターン）を過ごす育成シミュレーションです。イベントの選択肢と毎週のコマンドで、蓮との関係が変化します。</p>" +
        "<h2>関係値（蓮）</h2>" +
        "<p>友情・信頼・親密・恋愛感情・嫉妬・警戒を別々に管理します。友情100でも恋愛感情0なら「親友エンド」、恋愛感情と親密が高まれば「恋愛成就エンド」へ分岐します。嫉妬や警戒を溜めすぎると、すれ違いの結末に……。</p>" +
        "<h2>登場人物</h2>" +
        "<ul>" +
        "<li><strong>蓮</strong> ― 小学生からの幼なじみ。同じ中学・高校・大学に進み、社会人になってからはルームシェアの同居人に。</li>" +
        "<li><strong>美咲</strong> ― 蓮の彼女。明るくて気配りのできる女性。</li>" +
        "<li><strong>栞</strong> ― 大学の後輩。主人公にずっと好意を寄せている。</li>" +
        "<li><strong>圭介</strong> ― 会社の男の先輩。面倒見がいい。</li>" +
        "<li><strong>沙織</strong> ― 会社の女の先輩。仕事の相談相手。</li>" +
        "<li><strong>黒田課長</strong> ― 嫌な上司……と思いきや、たまに意外な一面も。</li>" +
        "</ul>" +
        "<div class=\"row\"><button type=\"button\" id=\"m-close2\">閉じる</button></div>"
      );
      $("m-close2").addEventListener("click", closeModal);
    }

    /* ============================================================
       開始・配線
       ============================================================ */
    function startGame(fresh){
      $("screen-title").classList.add("hidden");
      $("screen-game").classList.remove("hidden");
      $("statusbar").classList.remove("hidden");
      if(fresh){
        playScene(openingPages(), () => startTurn());
      } else {
        startTurn();
      }
      renderStatus();
    }
    $("btn-start").addEventListener("click", () => {
      const nm = $("player-name").value.trim() || "悠真";
      S = newState(nm);
      BGM.start("title");
      startGame(true);
    });
    const GALLERY = [
      ["assets/flashback.webp","回想：田んぼ道（小学生）"],["assets/flashback-river.webp","回想：川遊び（小学生）"],["assets/flashback-soccer.webp","回想：サッカー部（中学生）"],["assets/flashback-highschool.webp","回想：帰り道（高校生）"],
      ["assets/ren.webp","蓮：通常"],["assets/ren-suit.webp","蓮：スーツ笑顔"],["assets/ren-suit-serious.webp","蓮：スーツ真剣"],["assets/ren-sad.webp","蓮：悲しみ"],["assets/ren-shy.webp","蓮：照れ"],["assets/ren-surprised.webp","蓮：驚き"],["assets/ren-yukata.webp","蓮：浴衣"],["assets/ren-winter.webp","蓮：冬"],["assets/ren-drunk.webp","蓮：酔い"],["assets/ren-care.webp","蓮：心配"],["assets/ren-confess.webp","蓮：告白"],
      ["assets/yuma-smile.webp","主人公：通常"],["assets/yuma-suit.webp","主人公：就活スーツ"],["assets/yuma-tired.webp","主人公：疲労"],["assets/yuma-yukata.webp","主人公：浴衣"],["assets/yuma-winter.webp","主人公：冬"],["assets/yuma-drunk.webp","主人公：酔い"],["assets/yuma-sick.webp","主人公：病気"],["assets/yuma-confess.webp","主人公：告白"],
      ["assets/misaki.webp","美咲：通常"],["assets/misaki-sad.webp","美咲：悲しみ"],["assets/misaki-cafe.webp","美咲：カフェ"],
      ["assets/shiori.webp","栞：通常"],["assets/shiori-cry.webp","栞：涙の告白"],["assets/shiori-valentine.webp","栞：バレンタイン"],["assets/shiori-cafe.webp","栞：カフェ"],
      ["assets/keisuke.webp","圭介先輩：通常"],["assets/keisuke-coffee.webp","圭介先輩：缶コーヒー"],["assets/saori.webp","沙織先輩：通常"],["assets/saori-drink.webp","沙織先輩：飲み会"],
      ["assets/kuroda.webp","黒田課長：厳しい顔"],["assets/kuroda-soft.webp","黒田課長：意外な笑顔"],["assets/mother.webp","母：通常"],["assets/mother-phone.webp","母：電話"],

    ];
    function openGallery(){
      let html = "<h2>グラフィックギャラリー（全" + GALLERY.length + "枚）</h2><p>主人公と蓮を中心に、脇役の立ち絵と場面CGを収録しています。</p><div class=\"gal-grid\">";
      GALLERY.forEach(g => { html += "<figure><img loading=\"lazy\" src=\"" + g[0] + "\" alt=\"" + g[1] + "\" /><figcaption>" + g[1] + "</figcaption></figure>"; });
      html += "</div><div class=\"row\"><button type=\"button\" id=\"m-close3\">閉じる</button></div>";
      openModal(html);
      $("m-close3").addEventListener("click", closeModal);
    }
    $("btn-gallery").addEventListener("click", openGallery);
    $("btn-load-title").addEventListener("click", openSaveModal);
    $("btn-howto").addEventListener("click", openHowto);
    $("btn-save").addEventListener("click", openSaveModal);
    $("btn-status").addEventListener("click", () => {
      const p = $("status-panel");
      p.scrollIntoView({ behavior: "smooth", block: "center" });
    });
    $("btn-bgm").addEventListener("click", () => {
      const v = !BGM.isOn();
      BGM.setOn(v);
      $("btn-bgm").textContent = v ? "♪ BGM オン" : "♪ BGM オフ";
      if(v) BGM.start("daily");
    });
    // 最初のタップでAudioContextを起こすため、タイトル操作時にもBGM開始
    document.addEventListener("pointerdown", function once(){
      BGM.start("title");
      document.removeEventListener("pointerdown", once);
    });
  </script>

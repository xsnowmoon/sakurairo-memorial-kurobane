<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#07090f;color:#eef0f4;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{max-width:860px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:#0a0d16}
/* toolbar */
#toolbar{display:flex;gap:6px;padding:8px 10px;background:#0d111f;border-bottom:1px solid #232a44;flex-wrap:wrap}
#toolbar button{flex:1;min-height:44px;min-width:64px;border-radius:10px;border:1px solid #33406b;background:#171e35;color:#dfe6ff;font-size:14px;font-weight:700;padding:6px 4px}
#toolbar button:active{background:#232e52}
/* stage */
#stage{position:relative;width:100%;background:#000}
#bgCanvas{width:100%;display:block;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges}
#sceneName{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.55);color:#cfd8ff;font-size:13px;padding:5px 10px;border-radius:999px;letter-spacing:.08em}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s}
/* text window */
#textArea{flex:1;display:flex;flex-direction:column;padding:14px 16px 10px;background:linear-gradient(#101527,#0a0d18);cursor:pointer;min-height:220px}
#speaker{font-size:14px;color:#9fb4ff;font-weight:700;min-height:20px;letter-spacing:.06em}
#text{font-size:21px;line-height:1.85;min-height:118px;white-space:pre-wrap;word-break:break-all}
#indicator{text-align:right;color:#8fa0d8;font-size:15px;min-height:22px;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
#choices{display:none;flex-direction:column;gap:10px;padding:4px 16px 16px;background:#0a0d18}
#choices button{min-height:58px;border-radius:12px;border:1px solid #4a5da0;background:#1b2547;color:#fff;font-size:18px;font-weight:700;padding:12px}
#choices button:active{background:#2a3a6e}
/* title */
#titleScreen{padding:28px 20px 40px;text-align:center;background:radial-gradient(ellipse at 50% 0%,#1c2748 0%,#0a0d18 62%);min-height:100dvh}
#titleScreen .fog{font-size:13px;letter-spacing:.5em;color:#7e8fc4}
#titleScreen h1{font-size:56px;margin:10px 0 2px;letter-spacing:.18em;text-shadow:0 0 24px rgba(140,170,255,.45)}
#titleScreen .sub{font-size:16px;color:#aebadd;letter-spacing:.24em;margin-bottom:8px}
#titleCanvas{width:min(92%,520px);aspect-ratio:16/9;image-rendering:pixelated;border:1px solid #2b3760;border-radius:8px;margin:14px auto;display:block}
.menuBtn{display:block;width:min(92%,420px);margin:10px auto;min-height:60px;border-radius:12px;border:1px solid #4a5da0;background:#1b2547;color:#fff;font-size:19px;font-weight:700;padding:12px}
.menuBtn:disabled{opacity:.38}
.menuBtn.sub2{background:#121830;font-size:15px;min-height:48px}
#endingBox{width:min(92%,420px);margin:18px auto;background:#10162b;border:1px solid #28345e;border-radius:12px;padding:14px;text-align:left}
#endingBox h2{font-size:15px;margin:0 0 8px;color:#9fb4ff}
#endingBox div{font-size:15px;line-height:1.9;color:#d5dcf5}
.credit{margin-top:22px;font-size:14px;color:#8b98c4;line-height:1.8}
.note{font-size:13px;color:#7787b5;line-height:1.7;width:min(92%,420px);margin:10px auto 0;text-align:left}
/* modal */
.modal{position:fixed;inset:0;background:rgba(2,4,10,.82);display:none;z-index:50;padding:18px}
.modalInner{max-width:760px;margin:0 auto;background:#111830;border:1px solid #33406b;border-radius:14px;max-height:88dvh;display:flex;flex-direction:column}
.modalInner h2{margin:0;padding:16px 18px 8px;font-size:19px}
#logBody{overflow-y:auto;padding:6px 18px 14px;font-size:16px;line-height:1.9;color:#dbe2f8;white-space:pre-wrap}
.modalInner .closeBtn{margin:0 16px 16px;min-height:52px;border-radius:10px;border:1px solid #4a5da0;background:#1b2547;color:#fff;font-size:17px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:#1d294f;color:#fff;border:1px solid #4a5da0;padding:12px 20px;border-radius:999px;font-size:15px;display:none;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#endScreen{display:none;padding:30px 20px 44px;text-align:center;background:#0a0d18;min-height:100dvh}
#endScreen .endLabel{letter-spacing:.4em;color:#8fa0d8;font-size:14px}
#endScreen h2{font-size:34px;margin:12px 0}
#endScreen p{font-size:17px;line-height:1.9;color:#cfd8f2;max-width:560px;margin:0 auto 20px;text-align:left}
.hidden{display:none!important}
@media(max-width:560px){#text{font-size:19px}#titleScreen h1{font-size:44px}#toolbar button{font-size:12px;min-width:52px}}
</style>
</head>

<script>
"use strict";
/* ================= AUDIO (WebAudio, all synthesized) ================= */
var AC=null, rainNodes=null, soundOn=true;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function startRain(){
  if(!soundOn||rainNodes)return; var c=ac(); if(!c)return;
  var len=2*c.sampleRate, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var src=c.createBufferSource(); src.buffer=buf; src.loop=true;
  var f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
  var g=c.createGain(); g.gain.value=0.045;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  rainNodes={src:src,g:g};
}
function stopRain(){ if(rainNodes){ try{rainNodes.src.stop();}catch(e){} rainNodes=null; } }
function beep(freq,dur,type,vol,slideTo){
  if(!soundOn)return; var c=ac(); if(!c)return;
  var o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,c.currentTime);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+dur);
  g.gain.setValueAtTime(vol||0.12,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}
function sfx(name){
  if(!soundOn)return;
  if(name==="door"){ beep(140,0.5,"sawtooth",0.06,70); setTimeout(function(){beep(90,0.3,"square",0.05,60);},350); }
  else if(name==="step"){ beep(70,0.09,"sine",0.10,50); }
  else if(name==="heart"){ beep(55,0.16,"sine",0.22,40); setTimeout(function(){beep(50,0.14,"sine",0.16,38);},240); }
  else if(name==="bell"){ beep(880,1.4,"sine",0.10); beep(1320,1.1,"sine",0.05); setTimeout(function(){beep(880,1.6,"sine",0.09);},900); }
  else if(name==="thunder"){ beep(60,1.2,"sawtooth",0.10,35); }
  else if(name==="page"){ beep(1200,0.06,"triangle",0.05,700); }
  else if(name==="key"){ beep(1560,0.1,"square",0.06); setTimeout(function(){beep(2090,0.14,"square",0.06);},110); }
  else if(name==="splash"){ beep(300,0.5,"sine",0.10,80); }
  else if(name==="chime"){ beep(1040,0.7,"sine",0.08); beep(1560,0.9,"sine",0.05); }
}
function setSound(on){
  soundOn=on;
  document.getElementById("btnSound").textContent=on?"🔊 音 ON":"🔇 音 OFF";
  document.getElementById("btnSoundTitle").textContent=on?"🔊 音：ON":"🔇 音：OFF";
  if(on){ if(!document.getElementById("gameScreen").classList.contains("hidden"))startRain(); }
  else stopRain();
}

/* ================= DOT-ART BACKGROUNDS (240x135 canvas, code-drawn) ================= */
var cv=document.getElementById("bgCanvas"), ctx=cv.getContext("2d");
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function P(x,y,c){ R(x,y,2,2,c); }
function stars(seed,n,ymax){ var s=seed; for(var i=0;i<n;i++){ s=(s*1103515245+12345)%2147483648; P(s%238,(s>>3)%ymax,"#aebadd"); } }
function fogBands(alpha){ ctx.fillStyle="rgba(190,200,225,"+alpha+")"; for(var i=0;i<5;i++){ var y=18+i*24+((i*37)%9); ctx.fillRect(0,y,240,7+((i*13)%5)); } }
function rainDrops(n){ ctx.strokeStyle="rgba(170,190,235,.55)"; ctx.lineWidth=1; ctx.beginPath(); for(var i=0;i<n;i++){ var x=(i*47+((i*i*7)%31))%240, y=(i*29)%135; ctx.moveTo(x,y); ctx.lineTo(x-2,y+6);} ctx.stroke(); }
function mansion(x,y,s,dark){
  var wall=dark?"#232a3d":"#4a5468", roof=dark?"#141926":"#2b3247", win=dark?"#0f1420":"#ffd98a";
  R(x,y+18*s,64*s,40*s,wall); R(x-5*s,y+12*s,74*s,8*s,roof); R(x+24*s,y+2*s,16*s,12*s,roof);
  R(x+28*s,y+40*s,9*s,18*s,"#10141f");
  R(x+6*s,y+26*s,8*s,10*s,win); R(x+50*s,y+26*s,8*s,10*s,win); R(x+28*s,y+22*s,8*s,8*s,win);
  if(!dark){ R(x+30*s,y+44*s,4*s,4*s,"#ffe9a8"); }
}

   R(104,118,34,4,"#1c222c"); fogBands(.20); rainDrops(40); },

var SCENE_NAMES={road:"雨の山道",mansion_ext:"霧の中の洋館",hall:"玄関ホール",corridor:"暗い廊下",library:"書斎",dining:"食堂",stairs:"地下への階段",garden:"庭と井戸",dawn:"夜明けの館",photo_close:"古い写真"};

/* ================= STORY ================= */
/* flags: photo, diary, key, bell */
var N={
start:{bg:"road",sfx:"thunder",text:["雨が、フロントガラスを叩いていた。","山道に入ってから、もう三十分。ナビの画面はとっくに固まり、携帯の電波は一本も立っていない。","――その時だった。エンジンが、小さく咳き込むような音を立てて、止まった。","何度キーを回しても、返事はない。ボンネットの隙間から、白い煙が細く立ちのぼる。","「……嘘だろ」","外は本降りの雨だ。歩いて戻れる距離じゃない。"],next:"road2"},
road2:{bg:"road",text:["傘はない。ジャケットを頭に被り、雨の中に立つ。","その時、霧の向こうに――光が見えた。","山の斜面の上、木立に囲まれて、ぽつんと明かりが灯っている。古い洋館の窓の光だ。","助けを求めるなら、あそこしかない。","濡れるのも構わず、私は霧の中の坂道を登り始めた。"],next:"gate"},
gate:{bg:"mansion_ext",text:["坂を登るにつれ、霧は濃くなった。","やがて、黒い鉄の門と、その奥に佇む大きな洋館が見えてきた。二階建ての、古い西洋館だ。","窓の明かりは、一階のひとつだけ。雨に濡れた壁は黒く沈み、まるで館全体が眠っているようだった。","門は、触れると音もなく開いた。","私は深呼吸をして、玄関の呼び鈴を押した。","――返事はない。"],next:"gate2"},
gate2:{bg:"mansion_ext",sfx:"door",text:["もう一度押そうと手を伸ばした、その時。","ギィ……と、重い音を立てて、玄関の扉がひとりでに開いた。","「……どなたか、いらっしゃいますか」","声は、暗いホールの中に吸い込まれて消えた。","誰もいない。けれど、開いた扉が、入ることを待っているように見えた。"],choices:[{t:"中に入る",to:"hall"},{t:"もう一度、声をかける",to:"gate_call"}]},
gate_call:{bg:"mansion_ext",text:["「すみませーん！　車が故障してしまって！」","雨音だけが返ってくる。","……と、館の奥で、かすかに何かが鳴った。時計の鐘のような、遠い音。","やはり、入るしかないようだ。"],next:"hall"},
hall:{bg:"hall",sfx:"door",text:["ホールに入った途端、背後で扉が閉まった。","鍵の音は、しない。なのに、押しても引いても、扉はびくともしなかった。","「……開けてください！」","返事の代わりに、ホールの蝋燭が揺れた。誰もいないのに、人の気配だけが、確かにある。","壁の古い絵。埃を被った調度品。――そして、テーブルの上に置かれた、一枚の写真立て。"],choices:[{t:"写真立てを手に取る",to:"photo",flag:"photo"},{t:"まず館の中を確かめる",to:"hall_look"}]},
hall_look:{bg:"hall",text:["ホールを見渡す。階段は二階へ続き、左右に廊下が伸びている。","床の埃には、最近のものらしい小さな足跡が、廊下の奥へ続いていた。","子供の足跡ほどの、大きさだった。","……気のせいだ、と思うことにした。写真立てが、目に留まった。"],next:"photo",flag:"photo"},
photo:{bg:"photo_close",sfx:"page",text:["写真立ての中は、色褪せた一枚の写真だった。","この館の前で撮られた、三人の家族。壮年の男性、穏やかに笑う女性、そして――。","真ん中に立つ、小さな女の子が、まっすぐこちらを見ていた。","写真の中の目と、合った気がした。","裏返すと、鉛筆で薄く書かれていた。『あめのよる、まよったひとを　まつ』"],next:"photo2"},
photo2:{bg:"hall",text:["（迷った人を、待つ……？）","その時、奥の廊下で、パタン、と扉の閉まる音がした。","心臓が跳ねる。誰か、いるのか。","行くしかない。私は写真を胸ポケットに仕舞い、廊下へ向かった。"],choices:[{t:"廊下の奥へ進む",to:"corridor"}]},
corridor:{bg:"corridor",sfx:"step",text:["廊下は暗く、雨音が遠くなった。","歩くたび、床板が軋む。自分の足音の、少し後ろでもうひとつ、音が――。","立ち止まると、音も止んだ。","左手に書斎、右手に食堂。どちらからも、かすかな生活の匂いがする。古い木と、紅茶と、埃の匂い。"],choices:[{t:"書斎に入る",to:"library"},{t:"食堂に入る",to:"dining"}]},
library:{bg:"library",text:["書斎は、本の壁に囲まれていた。","机の上には開かれた日記と、小さな真鍮の鍵。ランプには、つけたばかりのような温もりが残っている。","日記の最後のページだけ、新しいインクで書かれていた。"],choices:[{t:"日記を読む",to:"diary",flag:"diary"},{t:"鍵を持っていく",to:"getkey",flag:"key"}]},
diary:{bg:"library",sfx:"page",text:["『この館は、昔、山の旅人のための宿でした』","『雨の夜、霧で道を見失う人が多かった。だから私たちは、夜通し灯りを灯し、鐘を鳴らして、道を示し続けたのです』","『館は閉じても、約束は残りました。迷った人が来る夜は、灯りが灯り、鐘が鳴る。――あの子が、今も待っているから』","「あの子……」","写真の女の子。私は胸ポケットの写真に、そっと触れた。"],next:"library2"},
getkey:{bg:"library",sfx:"key",text:["真鍮の鍵を手に取った。ずっしりと重く、『庭』と彫られている。","庭への扉の鍵だろうか。ポケットに入れた。","机の日記が、まだ開かれたまま私を待っている気がした。"],next:"library2"},
library2:{bg:"library",text:["書斎を出ようとすると、ランプがひとりでに消えた。","代わりに、廊下の向こう――食堂の方から、食器の触れ合う小さな音が聞こえた。","カチャリ。まるで、誰かが食事の支度をしているような。"],choices:[{t:"食堂へ行く",to:"dining"},{t:"もう一度、日記と鍵を確認する",to:"library",cond:"needMoreLib"}]},
dining:{bg:"dining",text:["食堂には、三人分の食器が並んでいた。","そのうちのひとつからは、湯気が立っている。ついさっき、誰かが座っていたように。","「……誰かいるんですか。隠れていないで、出てきてください」","返事はない。けれど窓の外、雨の中に――小さな人影が、庭の方へ過ぎていった。","人影は、井戸の前で止まった。"],choices:[{t:"庭へ出てみる",to:"garden1"},{t:"食堂をよく調べる",to:"dining2"}]},
dining2:{bg:"dining",sfx:"page",text:["テーブルの下に、子供用の小さな椅子があった。背もたれには、花の彫刻。","壁のカレンダーは、何十年も前の日付で止まっている。けれど埃は少なく、誰かが今も手入れをしているようだった。","窓の外の人影は、もういない。井戸だけが、雨に濡れて立っていた。"],next:"garden1"},
garden1:{bg:"garden",sfx:"heart",text:["庭に出ると、雨は小降りになっていた。","井戸の前に立つと、底から水の音がする。……いや、違う。","井戸の底から、歌が聞こえる。子供の声で、古い子守唄のような歌が。","覗き込もうとした、その時。","背後で、館の鐘が鳴った。"],next:"bell1"},
bell1:{bg:"garden",sfx:"bell",text:["ゴーン、と低い鐘の音が、霧の中に響いた。","井戸の歌は、ぴたりと止んだ。","振り返ると、館の窓という窓に、ひとつずつ灯りが灯っていく。誰もいないはずの館が、目を覚ましていくようだった。","鐘は三度鳴り、そして――私の胸ポケットの中で、写真が微かに温かくなった気がした。","夜明けまで、あと少し。けれど館は、まだ私を帰す気がないらしい。"],choices:[{t:"地下への階段を調べる",to:"stairs1"},{t:"館に戻り、写真の子を探す",to:"seek"}]},
stairs1:{bg:"stairs",text:["食堂の脇に、地下への階段があった。冷たい空気が、下から昇ってくる。","一段降りるごとに、上の世界の音が遠くなる。","最下段の扉には、鍵穴がある。――けれど、私の持つ鍵は『庭』の鍵だ。形が、合わない。","扉の向こうから、すう、すうと、寝息のような音が聞こえた。"],choices:[{t:"扉に耳を澄ます",to:"stairs_listen"},{t:"階段を戻る",to:"seek"}]},
stairs_listen:{bg:"stairs",sfx:"heart",text:["耳を澄ます。寝息ではない。これは――風の音だ。","扉の隙間から、霧と一緒に、山の夜の空気が流れ込んでくる。地下室は、山の斜面に開いた、もうひとつの出口に繋がっているのかもしれない。","けれど鍵がない。この扉は、『待つ人』のためではなく、『帰る人』のために閉ざされている気がした。","私は階段を戻った。"],next:"seek"},
seek:{bg:"corridor",text:["館の中を、写真の子を探して歩いた。","「いるんでしょう。出てきてください。……ありがとうを、言わせてください」","自分でも驚いた。怖さよりも先に、その言葉が出た。","すると、二階へ続く階段の上で、小さな影が止まった。","女の子だった。写真と同じ服を着て、濡れもせず、静かにこちらを見ている。"],next:"seek2"},
seek2:{bg:"corridor",sfx:"chime",text:["女の子は、何も言わなかった。","ただ、ゆっくりと手を上げて――庭の方を、指さした。","そして、霧が晴れるように、姿が薄くなり、消えた。","残されたのは、微かな鈴の音と、開かれた庭への扉。","空が、白み始めている。"],choices:[{t:"庭の扉を開け、鐘の音の方へ行く",to:"finale_choice"},{t:"消えた場所に、もう一度呼びかける",to:"seek3"}]},
seek3:{bg:"corridor",text:["「待って。あなたの名前は――」","返事はない。けれど階段の手すりに、小さな鈴が置かれていた。触れると、ちりん、と澄んだ音が鳴る。","持っていて、ということなのだろう。私は鈴を握りしめ、庭への扉に向かった。"],next:"finale_choice"},
finale_choice:{bg:"garden",sfx:"bell",text:["庭に出た。霧の向こうで、鐘がもう一度鳴っている。","帰り道は、鐘の音の先にあるはずだ。","――その時、井戸の底から、再び歌声が聞こえた。今度は、はっきりと。『こっち、こっち』と、手招くように。","どうする。夜明けは近い。"],choices:[{t:"鐘の音を信じて、霧の中を進む",to:"end_good_check"},{t:"井戸の歌声に応える",to:"end_well"},{t:"館に戻って、真実を確かめる",to:"end_truth_check"}]},
end_good_check:{bg:"garden",text:["私は井戸に背を向け、鐘の音の方へ歩いた。","一歩ごとに霧が薄れ、濡れた草の匂いが強くなる。","歌声は遠くなり、やがて雨音に溶けて消えた。"],next:"end_good"},
end_well:{bg:"garden",sfx:"splash",text:["井戸を覗き込むと、水面に小さな手が――。","次の瞬間、足元の石が崩れた。","冷たい闇が、音もなく私を包んだ。鐘の音が、遠くで鳴っていた。"],next:"end_bad"},
end_truth_check:{bg:"library",text:["私は館に戻り、書斎のランプに火を入れた。","日記を最初から読み返す。写真と、鈴と、鐘の音。すべての点が、一本の線に繋がっていく。"],next:"end_truth"},
end_good:{ending:"good"},
end_truth:{ending:"truth"},
end_bad:{ending:"bad"}
};
var ENDINGS={
 good:{title:"エンディング１ ― 夜明けの帰り道",desc:"霧が晴れた山道を、私は歩いて下りた。振り返ると、洋館の窓の灯りがひとつずつ消えていく。最後に残った一階の灯りが、ちりん、と鈴の音とともに消えた。\n\n麓の駐在所で聞いた話では、あの館はもう何十年も無人だという。けれど雨の夜、迷った旅人がいる時だけ、今も灯りが灯るのだそうだ。\n\n胸ポケットの写真は、いつの間にか白紙になっていた。代わりに小さな鈴だけが残り、今も私の車のミラーで、静かに揺れている。"},
 truth:{title:"エンディング２ ― 霧の館の約束",desc:"日記の最後に、もう一行あった。『あの子は、雨の夜に道で倒れた旅人を助けようとして、自分が帰れなくなった。それからずっと、迷う人を待っている』。\n\n私は書斎の机に、写真と鈴を並べて置き、深く頭を下げた。「もう、大丈夫です。私が、この話を語り継ぎますから」。\n\n夜明け、館の扉は静かに開いた。女の子が、玄関で手を振っていた気がする。今度は笑顔で。霧の館の灯りは、その朝を最後に、二度と灯ることはなかったという。――待つ役目が、終わったから。"},
 bad:{title:"バッドエンド ― 井戸の底の歌",desc:"目が覚めた時、私は暗い場所にいた。頭上では雨音と、遠い鐘の音。\n\n「たすけて」と叫んでも、声は水の音に消えていく。\n\nそのうち、暗闇に目が慣れてきた。井戸の底の壁には、無数の小さな手形があった。みんな、雨の夜に迷った人たち――。\n\n今夜も雨が降る。霧の館の灯りが灯り、新しい客を待っている。そして井戸の底では、子守唄の歌い手が、ひとり増えているのだという。"}
};

/* ================= ENGINE ================= */
var state={node:"start",idx:0,flags:{},log:[]};
var typing=null,fullText="",shown=false;
var textEl=document.getElementById("text"),spEl=document.getElementById("speaker"),chEl=document.getElementById("choices");
function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.style.display="block"; setTimeout(function(){t.style.display="none";},1800); }
function fadeTo(cb){ var f=document.getElementById("fade"); f.style.opacity=1; setTimeout(function(){ cb(); f.style.opacity=0; },620); }
function curNode(){ return N[state.node]; }
function showParagraph(){
  var n=curNode(); if(n.ending){ showEnding(n.ending); return; }
  var txt=n.text[state.idx];
  state.log.push(txt);
  fullText=txt; shown=false; textEl.textContent=""; chEl.style.display="none";
  var i=0; clearInterval(typing);
  typing=setInterval(function(){ i++; textEl.textContent=fullText.slice(0,i); if(i>=fullText.length){ clearInterval(typing); shown=true; } },34);
}
function enterNode(id){
  var prev=curNode();
  state.node=id; state.idx=0;
  var n=curNode();
  if(n.flag)state.flags[n.flag]=true;
  var go=function(){ drawBG(n.bg||"hall"); if(n.sfx)sfx(n.sfx); showParagraph(); };
  if(prev&&prev.bg!==n.bg)fadeTo(go); else go();
}
function advance(){
  if(!shown){ clearInterval(typing); textEl.textContent=fullText; shown=true; return; }
  var n=curNode();
  if(n.choices&&state.idx>=n.text.length-1){ showChoices(n); return; }
  if(state.idx<n.text.length-1){ state.idx++; showParagraph(); return; }
  if(n.next)enterNode(n.next);
}
function showChoices(n){
  chEl.innerHTML="";
  n.choices.forEach(function(c){
    if(c.cond==="needMoreLib"&&state.flags.photo&&state.flags.diary&&state.flags.key)return;
    var b=document.createElement("button"); b.textContent=c.t;
    b.onclick=function(ev){ ev.stopPropagation(); sfx("step"); if(c.flag)state.flags[c.flag]=true; chEl.style.display="none"; enterNode(c.to); };
    chEl.appendChild(b);
  });
  chEl.style.display="flex";
}
document.getElementById("textArea").addEventListener("click",function(){ ac(); if(soundOn)startRain(); advance(); });
function showEnding(key){
  stopRain(); if(key==="good")sfx("chime"); if(key==="truth")sfx("bell"); if(key==="bad")sfx("heart");
  var got={}; try{ got=JSON.parse(localStorage.getItem("kiri_endings")||"{}"); }catch(e){}
  got[key]=true; try{ localStorage.setItem("kiri_endings",JSON.stringify(got)); }catch(e){}
  try{ localStorage.removeItem("kiri_save"); }catch(e){}
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").style.display="block";
  document.getElementById("endTitle").textContent=ENDINGS[key].title;
  document.getElementById("endDesc").textContent=ENDINGS[key].desc;
  refreshTitle();
}
function startGame(fromSave){
  document.getElementById("titleScreen").classList.add("hidden");
  document.getElementById("endScreen").style.display="none";
  document.getElementById("gameScreen").classList.remove("hidden");
  ac(); if(soundOn)startRain();
  if(!fromSave){ state={node:"start",idx:0,flags:{},log:[]}; }
  var n=curNode(); drawBG(n.bg||"road"); showParagraph();
}
function refreshTitle(){
  var got={}; try{ got=JSON.parse(localStorage.getItem("kiri_endings")||"{}"); }catch(e){}
  var rows=[["good","エンディング１ ― 夜明けの帰り道（脱出）"],["truth","エンディング２ ― 霧の館の約束（真相）"],["bad","バッドエンド ― 井戸の底の歌"]];
  document.getElementById("endingList").innerHTML=rows.map(function(r){ return (got[r[0]]?"● ":"○ ")+r[1]+(got[r[0]]?"　到達済み":"　未到達"); }).join("<br>");
  var has=false; try{ has=!!localStorage.getItem("kiri_save"); }catch(e){}
  document.getElementById("btnContinue").disabled=!has;
}
/* buttons */
document.getElementById("btnStart").onclick=function(){ startGame(false); };
document.getElementById("btnContinue").onclick=function(){
  try{ var s=JSON.parse(localStorage.getItem("kiri_save")); if(s){ state=s; startGame(true); toast("しおりから再開しました"); return; } }catch(e){}
  toast("しおりがありません");
};
document.getElementById("btnUpdate").onclick=function(){ try{ location.reload(); }catch(e){} toast("最新版に更新しています…"); };
document.getElementById("btnSoundTitle").onclick=function(){ setSound(!soundOn); if(soundOn)ac(); };
document.getElementById("btnSound").onclick=function(ev){ ev.stopPropagation(); setSound(!soundOn); };
document.getElementById("btnSave").onclick=function(ev){ ev.stopPropagation();
  try{ localStorage.setItem("kiri_save",JSON.stringify(state)); toast("🔖 しおりを挟みました"); refreshTitle(); }catch(e){ toast("保存できませんでした"); } };
document.getElementById("btnLoad").onclick=function(ev){ ev.stopPropagation();
  try{ var s=JSON.parse(localStorage.getItem("kiri_save")); if(s){ state=s; var n=curNode(); drawBG(n.bg||"hall"); state.idx=0; showParagraph(); toast("しおりを読みました"); return; } }catch(e){}
  toast("しおりがありません"); };
document.getElementById("btnTitle").onclick=function(ev){ ev.stopPropagation(); stopRain(); document.getElementById("gameScreen").classList.add("hidden"); document.getElementById("titleScreen").classList.remove("hidden"); refreshTitle(); };
document.getElementById("btnLog").onclick=function(ev){ ev.stopPropagation();
  document.getElementById("logBody").textContent=state.log.length?state.log.join("\n\n"):"（まだ何も表示されていません）";
  document.getElementById("logModal").style.display="block"; };
document.getElementById("btnLogClose").onclick=function(){ document.getElementById("logModal").style.display="none"; };
document.getElementById("btnEndTitle").onclick=function(){ document.getElementById("endScreen").style.display="none"; document.getElementById("titleScreen").classList.remove("hidden"); refreshTitle(); };
document.getElementById("btnEndRetry").onclick=function(){ startGame(false); };
drawTitle(); refreshTitle(); setSound(true);
</script>
</body>
</html>

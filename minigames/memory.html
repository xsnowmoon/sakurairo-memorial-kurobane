<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>図書室の神経衰弱 | Snow Moon Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#2e4038;color:#f2efe4;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:#b9c8bd;font-size:13px;margin-bottom:12px}
.panel{background:#f7f3e3;color:#2e3527;border-radius:12px;padding:14px}
.status{display:flex;justify-content:space-between;font-weight:900;font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:3/4;border:0;border-radius:8px;font-size:15px;font-weight:900;cursor:pointer;padding:4px;transition:transform .15s}
.card.back{background:#51695a;color:#cfe0cd;font-size:20px}
.card.face{color:#fff}
.card.done{opacity:.45;cursor:default}
.card:active{transform:scale(.96)}
.btn{display:block;width:100%;font-size:17px;font-weight:900;padding:14px;border:0;border-radius:10px;background:#e75480;color:#fff;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:#f2efe4;border:2px solid #8fa896}
.btn.sub2{background:#51695a}
.msg{text-align:center;font-weight:900;min-height:30px;margin-top:10px;font-size:17px}
.credit{text-align:center;color:#8fa896;font-size:12px;margin-top:14px}
.turn{padding:2px 10px;border-radius:999px;background:#e75480;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>📚 図書室の神経衰弱</h1>
<p class="sub">文芸部の部室で、本のペアをそろえよう</p>

<div class="panel" id="scr-title">
  <p>本の表紙（8種類×2冊）をめくって、同じ本のペアをそろえるゲームです。</p>
  <p>ひとりで遊ぶと「めくった回数」の少なさを競います。対戦モードでは、文芸部の月島ゆきと交互にめくって、取ったペア数を競います。</p>
  <p id="best-line" style="font-weight:700;color:#7a7260"></p>
  <button class="btn" id="btn-solo">ひとりで遊ぶ</button>
  <button class="btn sub2" id="btn-vs">ゆきと対戦する</button>
</div>

<div class="panel" id="scr-game" style="display:none">
  <div class="status"><span id="st-left">残り 8ペア</span><span id="st-info">めくり 0回</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <button class="btn ghost" id="btn-quit" style="color:#2e3527;border-color:#b9bfa4">タイトルに戻る</button>
</div>

<button class="btn ghost" onclick="location.href=location.href.split('?')[0]+'?b='+Date.now()">🔄 最新版に更新（キャッシュを消して読み直す）</button>
<p class="credit">Snow Moon Games Ver.20261121.1.0</p>
</div>
<script>
const BOOKS=[
 {n:"俳句集",c:"#b5524d"},{n:"星の本",c:"#44548c"},{n:"お菓子本",c:"#d98a2b"},{n:"歴史本",c:"#6b4f8f"},
 {n:"冒険譚",c:"#2e7d6b"},{n:"詩集",c:"#c2607e"},{n:"図鑑",c:"#57707e"},{n:"推理小説",c:"#4a4a55"}
];
let deck=[],open=[],matched=0,flips=0,lock=false,mode="solo",turn="you",pairs={you:0,yuki:0},cpuMem={};
function $(id){return document.getElementById(id)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function best(){try{return +localStorage.getItem("sm-memory-best")||0}catch(e){return 0}}
$("best-line").textContent=best()?("ひとりモードの最少記録："+best()+"回"):"";
$("btn-solo").onclick=()=>start("solo");
$("btn-vs").onclick=()=>start("vs");
$("btn-quit").onclick=()=>{$("scr-game").style.display="none";$("scr-title").style.display="block"};
function start(m){
 mode=m;matched=0;flips=0;lock=false;open=[];turn="you";pairs={you:0,yuki:0};cpuMem={};
 deck=shuffle(BOOKS.concat(BOOKS).map((b,i)=>({book:b,id:i})));
 const g=$("grid");g.innerHTML="";
 deck.forEach((d,i)=>{
  const c=document.createElement("button");c.className="card back";c.textContent="📖";c.dataset.i=i;
  c.onclick=()=>flip(i);g.appendChild(c);
 });
 $("scr-title").style.display="none";$("scr-game").style.display="block";
 update("あなたの番です。本を2冊めくってください");
}
function update(msg){
 $("st-left").textContent="残り "+(8-matched)+"ペア";
 $("st-info").innerHTML=mode==="solo"?("めくり "+flips+"回"):("あなた "+pairs.you+" ／ ゆき "+pairs.yuki+(turn==="you"?"　<span class='turn'>あなたの番</span>":"　<span class='turn'>ゆきの番</span>"));
 $("msg").textContent=msg||"";
}
function flip(i){
 if(lock)return;const c=$("grid").children[i];
 if(c.classList.contains("face")||c.classList.contains("done"))return;
 reveal(i);open.push(i);
 if(mode==="vs")cpuMem[i]=deck[i].book.n;
 if(open.length===2){flips++;lock=true;setTimeout(judge,750)}
}
function reveal(i){const c=$("grid").children[i];c.className="card face";c.style.background=deck[i].book.c;c.textContent=deck[i].book.n}
function hide(i){const c=$("grid").children[i];c.className="card back";c.textContent="📖";c.style.background=""}
function judge(){
 const [a,b]=open;open=[];
 if(deck[a].book.n===deck[b].book.n){
  [a,b].forEach(i=>{const c=$("grid").children[i];c.classList.add("done")});
  matched++;delete cpuMem[a];delete cpuMem[b];
  if(mode==="vs"){pairs[turn]++;update(turn==="you"?"ペア成立！もう一度めくれます":"ゆきがペアを取った！もう一度ゆきの番")}
  else update("ペア成立！");
  lock=false;
  if(matched===8)return finish();
  if(mode==="vs"&&turn==="yuki")setTimeout(cpuTurn,800);
 }else{
  [a,b].forEach(hide);
  if(mode==="solo"){update("ちがいました");lock=false}
  else{
   turn=turn==="you"?"yuki":"you";lock=false;
   update(turn==="you"?"あなたの番です":"ゆきの番です");
   if(turn==="yuki")setTimeout(cpuTurn,800);
  }
 }
}
function cpuTurn(){
 if(matched===8)return;
 // 覚えているペアがあれば取る
 const seen={};let pair=null;
 Object.keys(cpuMem).forEach(i=>{const n=cpuMem[i];if(seen[n]!==undefined)pair=[+seen[n],+i];seen[n]=i});
 let picks;
 if(pair)picks=pair;
 else{
  const closed=deck.map((d,i)=>i).filter(i=>{const c=$("grid").children[i];return !c.classList.contains("face")&&!c.classList.contains("done")});
  picks=shuffle(closed.slice()).slice(0,2);
 }
 lock=true;
 setTimeout(()=>{reveal(picks[0]);cpuMem[picks[0]]=deck[picks[0]].book.n;
  setTimeout(()=>{reveal(picks[1]);cpuMem[picks[1]]=deck[picks[1]].book.n;open=picks;flips++;setTimeout(judge,750)},650);
 },450);
}
function finish(){
 if(mode==="solo"){
  const b=best();if(!b||flips<b){try{localStorage.setItem("sm-memory-best",flips)}catch(e){}}
  update("全部そろいました！ めくり "+flips+"回"+((!b||flips<b)?"（新記録！）":""));
 }else{
  update(pairs.you>pairs.yuki?("対戦終了：あなたの勝ち！ "+pairs.you+"対"+pairs.yuki):pairs.you<pairs.yuki?("対戦終了：ゆきの勝ち "+pairs.you+"対"+pairs.yuki):("対戦終了：引き分け "+pairs.you+"対"+pairs.yuki));
 }
}
</script>
</body>
</html>

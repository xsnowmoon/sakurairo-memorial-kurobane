<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文化祭たこ焼き屋 | Snow Moon Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:sans-serif;background:#4a2c1a;color:#fff7ec;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;text-align:center;margin:8px 0 2px}
.sub{text-align:center;color:#e8c9a8;font-size:13px;margin-bottom:12px}
.panel{background:#fff7ec;color:#4a2c1a;border-radius:12px;padding:14px}
.status{display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-bottom:8px}
.cust{display:flex;gap:8px;min-height:86px;margin-bottom:10px}
.cust .c{flex:1;background:#fff;border:2px solid #d9b98c;border-radius:10px;padding:6px;text-align:center;font-size:13px;font-weight:700}
.cust .c.empty{opacity:.35}
.cust .want{font-size:22px}
.patience{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin-top:4px}
.patience i{display:block;height:100%;background:#e75480}
.grill{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.slot{aspect-ratio:1;border:0;border-radius:50%;font-size:30px;cursor:pointer;background:#6b6b6b;color:#fff}
.slot.raw{background:#e8dcc0}
.slot.cooked{background:#b5651d;box-shadow:0 0 0 4px #ffd76a inset}
.slot:active{transform:scale(.95)}
.btn{display:block;width:100%;font-size:17px;font-weight:900;padding:14px;border:0;border-radius:10px;background:#e75480;color:#fff;cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:#fff7ec;border:2px solid #a97c50}
.msg{text-align:center;font-weight:900;min-height:30px;margin-top:8px;font-size:16px}
.credit{text-align:center;color:#c9a06a;font-size:12px;margin-top:14px}
.big{font-size:30px;font-weight:900;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>🐙 文化祭たこ焼き屋</h1>
<p class="sub">あかりと二人で切り盛りする、文化祭の出店です</p>

<div class="panel" id="scr-title">
  <p>制限時間60秒。お客さんの注文（個数）に合わせて、たこ焼きを焼いて渡しましょう。</p>
  <p>① 鉄板の空きをタップ → 生地を入れる<br>② しばらくすると焼き上がる（金色）<br>③ 焼けたものをタップ → お客さんに渡す</p>
  <p>1個 150円。お客さんを待たせすぎると帰ってしまいます。</p>
  <p id="best-line" style="font-weight:700;color:#8a6a45"></p>
  <button class="btn" id="btn-start">開店する</button>
</div>

<div class="panel" id="scr-game" style="display:none">
  <div class="status"><span id="st-time">⏱ 60秒</span><span id="st-money">💰 0円</span></div>
  <div class="cust" id="cust"></div>
  <div class="grill" id="grill"></div>
  <div class="msg" id="msg">鉄板をタップして焼き始めよう</div>
</div>

<div class="panel" id="scr-result" style="display:none">
  <div class="big">閉店！</div>
  <div class="big" id="r-money">0円</div>
  <p class="center" id="r-msg" style="text-align:center"></p>
  <button class="btn" id="btn-retry">もう一度開店</button>
</div>

<button class="btn ghost" onclick="location.href=location.href.split('?')[0]+'?b='+Date.now()">🔄 最新版に更新（キャッシュを消して読み直す）</button>
<p class="credit">Snow Moon Games Ver.20261121.1.0</p>
</div>
<script>
const FACES=["🧑","👩","👦","👧","👴","👵","🧒","👨"];
let slots=[],custs=[],money=0,time=60,timer=null,spawnT=null,playing=false;
function $(id){return document.getElementById(id)}
function best(){try{return +localStorage.getItem("sm-takoyaki-best")||0}catch(e){return 0}}
$("best-line").textContent=best()?("これまでの最高売上："+best()+"円"):"";
$("btn-start").onclick=start;$("btn-retry").onclick=start;
function start(){
 money=0;time=60;playing=true;
 slots=Array.from({length:6},()=>({st:0,at:0})); // 0空 1生地 2焼けた
 custs=[];
 $("scr-title").style.display="none";$("scr-result").style.display="none";$("scr-game").style.display="block";
 draw();addCust();addCust();
 timer=setInterval(tick,1000);
 spawnT=setInterval(()=>{if(custs.length<3&&Math.random()<0.7)addCust()},2600);
}
function addCust(){
 if(custs.length>=3)return;
 custs.push({face:FACES[Math.floor(Math.random()*FACES.length)],want:1+Math.floor(Math.random()*3),pat:100});
 draw();
}
function draw(){
 $("st-time").textContent="⏱ "+time+"秒";
 $("st-money").textContent="💰 "+money+"円";
 const cc=$("cust");cc.innerHTML="";
 for(let i=0;i<3;i++){
  const c=custs[i];const d=document.createElement("div");d.className="c"+(c?"":" empty");
  d.innerHTML=c?(c.face+"<div class='want'>🐙×"+c.want+"</div><div>あと"+c.want+"個</div><div class='patience'><i style='width:"+c.pat+"%'></i></div>"):"（席あき）";
  cc.appendChild(d);
 }
 const g=$("grill");g.innerHTML="";
 slots.forEach((s,i)=>{
  const b=document.createElement("button");
  b.className="slot"+(s.st===1?" raw":s.st===2?" cooked":"");
  b.textContent=s.st===0?"＋":s.st===1?"◯":"🐙";
  b.onclick=()=>tapSlot(i);g.appendChild(b);
 });
}
function tapSlot(i){
 if(!playing)return;const s=slots[i];
 if(s.st===0){s.st=1;s.at=Date.now();$("msg").textContent="生地を入れた。焼けるまで待とう"}
 else if(s.st===2){
  const c=custs.find(x=>x.want>0);
  if(!c){$("msg").textContent="今はお客さんがいない…焼けたものは置いておこう";return}
  c.want--;money+=150;s.st=0;
  if(c.want===0){custs.splice(custs.indexOf(c),1);$("msg").textContent="まいどあり！ +150円ごとに喜んでくれた"}
  else $("msg").textContent="お客さんに渡した（+150円）";
 }
 draw();
}
function tick(){
 if(!playing)return;
 time--;
 const now=Date.now();
 slots.forEach(s=>{if(s.st===1&&now-s.at>=3200)s.st=2});
 let left=false;
 custs.forEach(c=>{c.pat-=4;if(c.pat<=0)left=true});
 if(left){custs=custs.filter(c=>c.pat>0);$("msg").textContent="お客さんが待ちきれず帰ってしまった…"}
 draw();
 if(time<=0)finish();
}
function finish(){
 playing=false;clearInterval(timer);clearInterval(spawnT);
 $("scr-game").style.display="none";$("scr-result").style.display="block";
 $("r-money").textContent=money+"円";
 const b=best();if(money>b){try{localStorage.setItem("sm-takoyaki-best",money)}catch(e){}}
 $("r-msg").textContent=(money>b&&b>0?"新記録！ ":"")+(money>=3000?"大繁盛！あかりも大喜びです。":money>=1500?"まずまずの売れ行きでした。":"今日は静かでした…焼き加減を練習しよう。");
}
</script>
</body>
</html>
